<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 190" style="background:#0f0f0f;font-family:'Fira Code',Courier,monospace">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L0,6 L8,3 z" fill="#5ba3f5"/>
    </marker>
  </defs>

  <!-- Section labels -->
  <text x="90"  y="9" fill="#5ba3f5" font-size="8" text-anchor="middle" opacity="0.6">sources</text>
  <text x="250" y="9" fill="#5ba3f5" font-size="8" text-anchor="middle" opacity="0.6">routing</text>
  <text x="410" y="9" fill="#5ba3f5" font-size="8" text-anchor="middle" opacity="0.6">parsing</text>
  <text x="600" y="9" fill="#5ba3f5" font-size="8" text-anchor="middle" opacity="0.6">storage</text>
  <text x="790" y="9" fill="#5ba3f5" font-size="8" text-anchor="middle" opacity="0.6">in-memory</text>
  <text x="950" y="9" fill="#5ba3f5" font-size="8" text-anchor="middle" opacity="0.6">notifications</text>

  <!-- Data Source: x=20, w=140 -->
  <rect x="20"  y="18" width="140" height="75" rx="6" fill="#141414" stroke="#5ba3f5" stroke-width="1.5"/>
  <rect x="20"  y="18" width="140" height="22" rx="6" fill="#5ba3f5" opacity="0.18"/>
  <text x="90"  y="34" fill="#5ba3f5" font-size="10.5" font-weight="bold" text-anchor="middle">Data Source</text>
  <text x="90"  y="52" fill="#e8e8e8" font-size="9.5" text-anchor="middle">* HTTP query</text>
  <text x="90"  y="67" fill="#e8e8e8" font-size="9.5" text-anchor="middle">* WEB socket</text>
  <text x="90"  y="82" fill="#e8e8e8" font-size="9.5" text-anchor="middle">* File</text>

  <line x1="160" y1="66" x2="178" y2="66" stroke="#5ba3f5" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Data Dispatcher: x=180, w=140 -->
  <rect x="180" y="18" width="140" height="75" rx="6" fill="#141414" stroke="#5ba3f5" stroke-width="1.5"/>
  <rect x="180" y="18" width="140" height="22" rx="6" fill="#5ba3f5" opacity="0.18"/>
  <text x="250" y="34" fill="#5ba3f5" font-size="10.5" font-weight="bold" text-anchor="middle">Data Dispatcher</text>
  <text x="250" y="60" fill="#e8e8e8" font-size="9.5" text-anchor="middle">Dispatches by</text>
  <text x="250" y="75" fill="#e8e8e8" font-size="9.5" text-anchor="middle">message type</text>

  <line x1="320" y1="66" x2="338" y2="66" stroke="#5ba3f5" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Data Adapter: x=340, w=140 -->
  <rect x="340" y="18" width="140" height="75" rx="6" fill="#141414" stroke="#5ba3f5" stroke-width="1.5"/>
  <rect x="340" y="18" width="140" height="22" rx="6" fill="#5ba3f5" opacity="0.18"/>
  <text x="410" y="34" fill="#5ba3f5" font-size="10.5" font-weight="bold" text-anchor="middle">Data Adapter</text>
  <text x="410" y="52" fill="#e8e8e8" font-size="9.5" text-anchor="middle">Unwraps JSON</text>
  <text x="410" y="67" fill="#e8e8e8" font-size="9.5" text-anchor="middle">Deserialize exact</text>
  <text x="410" y="82" fill="#e8e8e8" font-size="9.5" text-anchor="middle">data type</text>

  <line x1="480" y1="66" x2="498" y2="66" stroke="#5ba3f5" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Data Sink: x=500, w=200 (wider, 3 lines) -->
  <rect x="500" y="18" width="200" height="75" rx="6" fill="#141414" stroke="#5ba3f5" stroke-width="1.5"/>
  <rect x="500" y="18" width="200" height="22" rx="6" fill="#5ba3f5" opacity="0.18"/>
  <text x="600" y="34" fill="#5ba3f5" font-size="10.5" font-weight="bold" text-anchor="middle">Data Sink</text>
  <text x="600" y="52" fill="#e8e8e8" font-size="9.5" text-anchor="middle">Collect data from multiple paths</text>
  <text x="600" y="67" fill="#e8e8e8" font-size="9.5" text-anchor="middle">Store to DB</text>
  <text x="600" y="82" fill="#e8e8e8" font-size="9.5" text-anchor="middle">Forward to memory cache</text>

  <line x1="700" y1="66" x2="718" y2="66" stroke="#5ba3f5" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Data Feed: x=720, w=140 -->
  <rect x="720" y="18" width="140" height="75" rx="6" fill="#141414" stroke="#5ba3f5" stroke-width="1.5"/>
  <rect x="720" y="18" width="140" height="22" rx="6" fill="#5ba3f5" opacity="0.18"/>
  <text x="790" y="34" fill="#5ba3f5" font-size="10.5" font-weight="bold" text-anchor="middle">Data Feed</text>
  <text x="790" y="52" fill="#e8e8e8" font-size="9.5" text-anchor="middle">Apply data feed rules</text>
  <text x="790" y="67" fill="#e8e8e8" font-size="9.5" text-anchor="middle">* Snapshot feed</text>
  <text x="790" y="82" fill="#e8e8e8" font-size="9.5" text-anchor="middle">* Sorted Stream</text>
  <!--text x="790" y="97" fill="#888"    font-size="9.5" text-anchor="middle">* etc...</text-->

  <line x1="860" y1="66" x2="878" y2="66" stroke="#5ba3f5" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Data Subscriptions: x=880, w=140 -->
  <rect x="880" y="18" width="140" height="75" rx="6" fill="#141414" stroke="#5ba3f5" stroke-width="1.5"/>
  <rect x="880" y="18" width="140" height="22" rx="6" fill="#5ba3f5" opacity="0.18"/>
  <text x="950" y="34" fill="#5ba3f5" font-size="10.5" font-weight="bold" text-anchor="middle">Data Subscriptions</text>
  <text x="950" y="60" fill="#e8e8e8" font-size="9.5" text-anchor="middle">Manage subscriptions</text>
  <text x="950" y="75" fill="#e8e8e8" font-size="9.5" text-anchor="middle">Signal on update</text>

  <!-- Data Sink → Data Model (blue, vertical) -->
  <line x1="600" y1="94" x2="600" y2="115" stroke="#5ba3f5" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Data Feed ↔ Data Model (orange L-shaped bidirectional) -->
  <polyline points="793,94 793,145 701,145" fill="none" stroke="#5ba3f5" stroke-width="1.5" marker-start="url(#arr)" marker-end="url(#arr)"/>

  <!-- Data Model: x=500, w=200 — aligned with Data Sink -->
  <rect x="500" y="117" width="200" height="58" rx="6" fill="#141414" stroke="#5ba3f5" stroke-width="1.5"/>
  <rect x="500" y="117" width="200" height="22" rx="6" fill="#5ba3f5" opacity="0.18"/>
  <text x="600" y="133" fill="#5ba3f5" font-size="10.5" font-weight="bold" text-anchor="middle">Data Model</text>
  <text x="600" y="160" fill="#e8e8e8" font-size="9.5" text-anchor="middle">DAO layer</text>
</svg>
