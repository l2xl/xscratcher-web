<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!--
    "PEN IN THE STORM" — ink / light-bg variant
    Black ink on off-white — closest to the source sketch image.
    This is the "print" or "light background" version of the mark.
    Same composition, inverted palette.
  -->
  <defs>
    <pattern id="hatch-ink" width="5" height="5"
             patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="5"
            stroke="#1a1410" stroke-width="0.7" opacity="0.3"/>
    </pattern>
    <pattern id="hatch-ink2" width="5" height="5"
             patternUnits="userSpaceOnUse" patternTransform="rotate(135)">
      <line x1="0" y1="0" x2="0" y2="5"
            stroke="#1a1410" stroke-width="0.5" opacity="0.2"/>
    </pattern>
    <filter id="wob2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="turbulence" baseFrequency="0.038"
                    numOctaves="3" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2"
                         xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <!-- Off-white paper background -->
  <rect width="400" height="400" fill="#f5f1e8"/>

  <!-- ══ VORTEX ARCS ══ -->
  <path d="M 10,88  C 122,26 252,100 298,176"
        fill="none" stroke="#1a1410" stroke-width="1"   stroke-linecap="round" opacity="0.14"/>
  <path d="M 30,82  C 132,34 246,102 285,172"
        fill="none" stroke="#1a1410" stroke-width="1.1" stroke-linecap="round" opacity="0.22"/>
  <path d="M 55,80  C 140,44 240,106 272,168"
        fill="none" stroke="#1a1410" stroke-width="1.3" stroke-linecap="round" opacity="0.30"/>
  <path d="M 80,82  C 148,54 233,110 258,164"
        fill="none" stroke="#1a1410" stroke-width="1.5" stroke-linecap="round" opacity="0.40"/>
  <path d="M 104,86 C 156,64 226,114 244,160"
        fill="none" stroke="#1a1410" stroke-width="1.7" stroke-linecap="round" opacity="0.52"/>
  <path d="M 124,92 C 164,74 218,118 232,156"
        fill="none" stroke="#1a1410" stroke-width="2.0" stroke-linecap="round" opacity="0.65"/>
  <path d="M 142,100 C 168,86 210,122 220,152"
        fill="none" stroke="#1a1410" stroke-width="1.6" stroke-linecap="round" opacity="0.5"/>

  <!-- Side echo arcs -->
  <path d="M 10,130 C 35,118 60,132 78,155 C 96,178 96,205 80,222"
        fill="none" stroke="#1a1410" stroke-width="0.9" stroke-linecap="round" opacity="0.22"/>
  <path d="M 295,168 C 318,175 338,168 355,152 C 372,136 378,112 368,92"
        fill="none" stroke="#1a1410" stroke-width="0.9" stroke-linecap="round" opacity="0.2"/>

  <!-- ══ PEN ══ -->
  <g transform="rotate(-11 200 284)">

    <!-- Cap -->
    <rect x="184" y="90" width="32" height="28" rx="16"
          fill="#f0f0e8" stroke="#1a1410" stroke-width="2"/>
    <!-- Cap dome shading (manga hatching) -->
    <path d="M 186,96 Q 200,90 214,96"
          fill="none" stroke="#1a1410" stroke-width="0.8" opacity="0.4"/>
    <circle cx="200" cy="90" r="3.5" fill="#1a1410"/>
    <!-- Cap clip -->
    <rect x="213" y="93" width="5" height="22" rx="2.5"
          fill="#ddd8c8" stroke="#1a1410" stroke-width="1.2"/>

    <!-- Collar -->
    <rect x="182" y="116" width="36" height="10" rx="2"
          fill="#e8e4dc" stroke="#1a1410" stroke-width="1.6"/>

    <!-- Upper barrel -->
    <rect x="184" y="126" width="32" height="90"
          fill="#f0ece4" stroke="#1a1410" stroke-width="1.8"/>
    <rect x="184" y="126" width="32" height="90"
          fill="url(#hatch-ink)"/>
    <line x1="189" y1="130" x2="189" y2="212"
          stroke="#f5f1e8" stroke-width="1.5" opacity="0.7"/>
    <!-- Inscription lines on barrel -->
    <line x1="190" y1="155" x2="208" y2="155"
          stroke="#1a1410" stroke-width="0.8" opacity="0.4"/>
    <line x1="190" y1="162" x2="208" y2="162"
          stroke="#1a1410" stroke-width="0.8" opacity="0.4"/>

    <!-- Metal band -->
    <rect x="181" y="216" width="38" height="17" rx="2"
          fill="#ccc8b8" stroke="#1a1410" stroke-width="2"/>
    <rect x="183" y="218" width="34" height="5" rx="1"
          fill="#e8e4d8" opacity="0.8"/>
    <line x1="183" y1="229" x2="217" y2="229"
          stroke="#1a1410" stroke-width="0.9" opacity="0.5"/>

    <!-- Lower barrel / grip -->
    <rect x="185" y="233" width="30" height="44"
          fill="#e8e4dc" stroke="#1a1410" stroke-width="1.6"/>
    <rect x="185" y="233" width="30" height="44" fill="url(#hatch-ink)"/>
    <rect x="185" y="233" width="30" height="44" fill="url(#hatch-ink2)"/>
    <line x1="190" y1="236" x2="190" y2="273"
          stroke="#f5f1e8" stroke-width="1.2" opacity="0.6"/>

    <!-- Nib -->
    <polygon points="185,277 215,277 200,300"
             fill="#e8e4dc" stroke="#1a1410"
             stroke-width="2" stroke-linejoin="round"/>
    <line x1="200" y1="278" x2="200" y2="298"
          stroke="#1a1410" stroke-width="1.1" opacity="0.7"/>
    <line x1="193" y1="281" x2="200" y2="294"
          stroke="#1a1410" stroke-width="0.6" opacity="0.3"/>

  </g>

  <!-- ══ WAVES ══ -->

  <!-- Back swell -->
  <path d="M 0,252 C 50,242 100,256 150,246
           C 200,236 250,248 300,240 C 340,234 370,244 400,238"
        fill="none" stroke="#1a1410" stroke-width="1"
        stroke-linecap="round" opacity="0.3"/>

  <!-- Mid wave -->
  <path d="M 0,264 C 42,252 82,268 118,256
           C 148,246 168,254 186,260 C 198,264 202,265 214,260
           C 234,253 262,262 296,252 C 330,242 364,256 400,248"
        fill="none" stroke="#1a1410" stroke-width="1.5"
        stroke-linecap="round" opacity="0.45" filter="url(#wob2)"/>

  <!-- Mid wave fill -->
  <path d="M 0,264 C 42,252 82,268 118,256
           C 148,246 168,254 186,260 C 198,264 202,265 214,260
           C 234,253 262,262 296,252 C 330,242 364,256 400,248
           L 400,278 C 364,272 330,258 296,267
           C 262,276 234,269 214,275 C 202,279 198,278 186,274
           C 168,268 148,260 118,270 C 82,282 42,266 0,278 Z"
        fill="url(#hatch-ink)" opacity="0.6"/>

  <!-- Front wave left -->
  <path d="M 0,282 C 28,268 55,284 82,272
           C 105,262 118,268 132,276 C 144,284 150,284 158,280"
        fill="none" stroke="#1a1410" stroke-width="2.6"
        stroke-linecap="round" opacity="0.9" filter="url(#wob2)"/>

  <!-- Front wave right -->
  <path d="M 245,276 C 256,272 268,280 286,270
           C 314,256 348,274 378,264 C 388,260 394,264 400,266"
        fill="none" stroke="#1a1410" stroke-width="2.6"
        stroke-linecap="round" opacity="0.9" filter="url(#wob2)"/>

  <!-- Wave fill hatching (left) -->
  <path d="M 0,282 C 28,268 55,284 82,272
           C 105,262 118,268 132,276 C 144,284 150,284 158,280
           L 158,306 C 150,308 144,308 132,300
           C 118,292 105,288 82,296 C 55,308 28,292 0,306 Z"
        fill="url(#hatch-ink)" opacity="0.6"/>

  <!-- Wave fill hatching (right) -->
  <path d="M 245,276 C 256,272 268,280 286,270
           C 314,256 348,274 378,264 C 388,260 394,264 400,266
           L 400,292 C 394,292 388,288 378,292
           C 348,302 314,284 286,296 C 268,306 256,298 245,302 Z"
        fill="url(#hatch-ink)" opacity="0.6"/>

  <!-- Water body -->
  <rect x="0" y="302" width="400" height="98" fill="#e8e4dc" opacity="0.4"/>
  <rect x="0" y="302" width="400" height="98" fill="url(#hatch-ink)" opacity="0.35"/>

  <!-- Water surface lines -->
  <g stroke="#1a1410" stroke-linecap="round">
    <line x1="18" y1="314" x2="382" y2="314" stroke-width="0.8" opacity="0.25"/>
    <line x1="10" y1="328" x2="390" y2="328" stroke-width="0.6" opacity="0.18"/>
    <line x1="25" y1="342" x2="375" y2="342" stroke-width="0.5" opacity="0.12"/>
    <line x1="40" y1="356" x2="360" y2="356" stroke-width="0.4" opacity="0.08"/>
  </g>

  <!-- Ripple rings -->
  <g fill="none" stroke="#1a1410">
    <ellipse cx="196" cy="292" rx="18"  ry="5"  stroke-width="1.3" opacity="0.55"/>
    <ellipse cx="196" cy="293" rx="32"  ry="8"  stroke-width="0.9" opacity="0.3"/>
    <ellipse cx="196" cy="295" rx="48"  ry="11" stroke-width="0.6" opacity="0.15"/>
  </g>

</svg>
