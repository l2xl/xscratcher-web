<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    "PEN IN THE STORM" — minimal icon
    Reads clearly at 32px–64px. All detail stripped to silhouette + gesture.
    Three elements only: vortex arcs, pen, wave.
  -->

  <!-- Background / container -->
  <rect width="64" height="64" rx="12" fill="#0f0f0f"/>

  <!-- ── Vortex arcs (condensed to 3 lines) ── -->
  <path d="M 4,14 C 18,6 36,14 44,28"
        fill="none" stroke="#f0e040" stroke-width="1.4"
        stroke-linecap="round" opacity="0.55"/>
  <path d="M 2,21 C 18,11 38,18 47,34"
        fill="none" stroke="#f0e040" stroke-width="1"
        stroke-linecap="round" opacity="0.35"/>
  <path d="M 2,28 C 20,18 40,22 50,38"
        fill="none" stroke="#f0e040" stroke-width="0.7"
        stroke-linecap="round" opacity="0.2"/>

  <!-- ── Pen (tilted ~11°, pivot at base) ── -->
  <g transform="rotate(-11 30 46)">
    <!-- Cap -->
    <rect x="24" y="10" width="12" height="10" rx="6"
          fill="#111" stroke="#f0e040" stroke-width="1.4"/>
    <!-- Cap crown dot -->
    <circle cx="30" cy="10" r="2" fill="#c8bc20"/>
    <!-- Barrel -->
    <rect x="24.5" y="20" width="11" height="20"
          fill="#0d0d0d" stroke="#f0e040" stroke-width="1.3"/>
    <!-- Left specular -->
    <line x1="27" y1="21" x2="27" y2="38"
          stroke="#fffbe8" stroke-width="0.8" opacity="0.25"/>
    <!-- Metal band -->
    <rect x="23" y="40" width="14" height="5" rx="1.5"
          fill="#1a1800" stroke="#f0e040" stroke-width="1.2"/>
    <!-- Nib -->
    <polygon points="24.5,45 35.5,45 30,54"
             fill="#0a0a0a" stroke="#f0e040"
             stroke-width="1.2" stroke-linejoin="round"/>
    <!-- Nib slit -->
    <line x1="30" y1="45" x2="30" y2="53"
          stroke="#f0e040" stroke-width="0.6" opacity="0.6"/>
  </g>

  <!-- ── Wave crest — left of pen ── -->
  <path d="M 2,46 C 8,42 14,46 20,43 C 24,41 25,42 26,44"
        fill="none" stroke="#f0e040" stroke-width="1.8"
        stroke-linecap="round" opacity="0.9"/>

  <!-- ── Wave crest — right of pen ── -->
  <path d="M 36,43 C 40,41 46,45 52,42 C 56,40 60,42 62,43"
        fill="none" stroke="#f0e040" stroke-width="1.8"
        stroke-linecap="round" opacity="0.9"/>

  <!-- ── Water body ── -->
  <rect x="0" y="50" width="64" height="14" rx="0" fill="#0a0a0a"/>
  <line x1="4"  y1="54" x2="60" y2="54"
        stroke="#f0e040" stroke-width="0.6" opacity="0.2"/>
  <line x1="6"  y1="58" x2="58" y2="58"
        stroke="#f0e040" stroke-width="0.4" opacity="0.12"/>

  <!-- ── Ripple rings at pen base ── -->
  <ellipse cx="30" cy="47" rx="6" ry="2"
           fill="none" stroke="#f0e040" stroke-width="0.9" opacity="0.5"/>
  <ellipse cx="30" cy="48" rx="10" ry="3"
           fill="none" stroke="#f0e040" stroke-width="0.6" opacity="0.25"/>

</svg>
