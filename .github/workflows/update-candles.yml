name: Update candlestick chart

on:
  schedule:
    # Every 15 minutes — matches the candle interval so the chart stays current
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      symbol:
        description: 'Trading pair (e.g. BTCUSDC, ETHUSDC)'
        default: 'BTCUSDC'
        required: false
      interval:
        description: 'Kline interval in minutes (1/3/5/15/30/60)'
        default: '15'
        required: false

permissions:
  contents: write

jobs:
  update:
    name: Fetch candles and commit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Fetch latest candles from Bybit
        run: |
          python3 market/fetch_candles.py \
            --symbol  "${{ github.event.inputs.symbol   || 'BTCUSDC' }}" \
            --interval "${{ github.event.inputs.interval || '15' }}" \
            --limit 80

      - name: Commit updated SVG (if changed)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add market/candlestick.svg
          git diff --staged --quiet && echo "Nothing changed, skipping commit." || \
            git commit -m "chore: update BTCUSDC 15m candles [skip ci]"

      - name: Push to main (triggers deploy)
        run: git push origin main
