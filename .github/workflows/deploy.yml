name: Deploy to Ubuntu server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: rsync to server via SSH
    runs-on: ubuntu-latest
    environment: DEPLOY

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy files via rsync over SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST:        ${{ secrets.SSH_HOST }}
          SSH_USER:        ${{ secrets.SSH_USER }}
          SSH_PORT:        ${{ secrets.SSH_PORT }}
        run: |
          # Write private key to temp file
          echo "$SSH_PRIVATE_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

          # Stop any in-flight candle fetch and remove the cron job if present.
          # Best-effort: || true ensures a failure here never blocks the deploy.
          ssh -i /tmp/deploy_key -p "${SSH_PORT:-22}" -o StrictHostKeyChecking=no \
            "$SSH_USER@$SSH_HOST" \
            'pkill -f "fetch_candles.py" 2>/dev/null; crontab -l 2>/dev/null | grep -v "fetch_candles.py" | crontab - 2>/dev/null; true' \
            || true

          # Sync all site files to the server's web root
          # Excludes hidden files (.git, .github, etc.) automatically via --exclude
          rsync -avz --delete \
            -e "ssh -i /tmp/deploy_key -p ${SSH_PORT:-22} -o StrictHostKeyChecking=no" \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='README.md' \
            --exclude='market/candles.json' \
            ./ \
            "$SSH_USER@$SSH_HOST:/var/www/scratcher/"

          # Clean up key
          rm -f /tmp/deploy_key
